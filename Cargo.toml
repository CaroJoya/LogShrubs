[package]
name = "loglens"
version = "0.1.0"
edition = "2021"
description = "A fast, local-first log analyzer built with Rust"
license = "MIT"
repository = "https://github.com/CaroJoya/LogShrubs"
readme = "README.md"
keywords = ["logs", "cli", "analysis", "devops", "observability"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "loglens"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true